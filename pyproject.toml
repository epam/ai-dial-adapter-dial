[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aidial-adapter-dial"
version = "0.14.0rc"
description = "DIAL application which adapts one DIAL Core to another DIAL Core"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-adapter-dial"

[project.scripts]
clean = "scripts.clean:main"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
fastapi = "0.120.2"
uvicorn = "0.23.0"
aiohttp = "3.13.4"
openai = "1.32.0"
pydantic = "1.10.13"
aidial-sdk = { version = "0.16.0", extras = ["telemetry"] }

[tool.poetry.group.test.dependencies]
pytest = "7.4.0"
pytest-asyncio = "0.21.1"
python-dotenv = "1.0.0"
respx = "^0.21.1"
aioresponses = "^0.7.8"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.324"
ruff = "0.12.11"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto"
testpaths = ["tests"]
filterwarnings = [
    # muting warnings coming from opentelemetry package
    "ignore::DeprecationWarning:opentelemetry.instrumentation.dependencies",
]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = [
    "ERA",  # flake8-eradicate
    "B",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "B9",   # flake8-bugbear
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # flake8-isort
    "S",    # flake8-bandit
    "FURB", # refurb,
    "UP",   # pyupgrade
]
ignore = [
    "E501", # string literal is too long
    "S101", # Use of `assert` detected
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aidial-adapter-dial"
version = "0.13.0rc"
description = "DIAL application which adapts one DIAL Core to another DIAL Core"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-adapter-dial"

[project.scripts]
clean = "scripts.clean:main"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
fastapi = "0.120.2"
uvicorn = "0.23.0"
aiohttp = "3.13.3"
openai = "1.32.0"
pydantic = "1.10.13"
aidial-sdk = {version = "0.16.0", extras = ["telemetry"]}

[tool.poetry.group.test.dependencies]
pytest = "7.4.0"
pytest-asyncio = "0.21.1"
python-dotenv = "1.0.0"
respx = "^0.21.1"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.324"
black = "26.3.1"
isort = "5.12.0"
autoflake = "2.2.0"
flake8 = "6.0.0"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto"
testpaths = [
    "tests"
]
# muting warnings coming from opentelemetry package
filterwarnings = [
    "ignore::DeprecationWarning:opentelemetry.instrumentation.dependencies"
]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
exclude = [
    ".git",
    ".venv",
    ".nox",
    "**/__pycache__",
    "docker-compose"
]

[tool.black]
line-length = 80
exclude = '''
/(
    \.git
  | \.venv
  | \.nox
  | \.__pycache__
  | docker-compose\/local\/core-data
)/
'''

[tool.isort]
line_length = 80
profile = "black"

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = [
    "\\.venv",
    "\\.nox",
]
